# Publishes a release when a version tag is pushed (see "Versioning and releases" in
# CONTRIBUTING.md):
#   vX.Y.Z                         -> TestPyPI, then PyPI, then a GitHub release
#   vX.Y.ZrcN / aN / bN / .devN    -> TestPyPI only (trial releases)
# Publishing uses PyPI Trusted Publishing: no API token is stored in the repository.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs computes the version from the tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Read the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag (expected vX.Y.Z, vX.Y.ZrcN, ...)"
            exit 1
          fi
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9]+$ ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (pre-release: $PRERELEASE)"

      - name: Check the changelog has a section for this version
        if: steps.version.outputs.prerelease == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Check the built version matches the tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls dist
          test -f "dist/pypu_learn-$VERSION-py3-none-any.whl" || {
            echo "::error::Built wheel does not have version $VERSION"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypu-learn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pypu-learn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract the release notes from the changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "PyPU ${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md
