name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install "ruff>=0.17"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to compute the version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenMP (LightGBM's macOS wheels do not bundle it)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test
      - name: Show versions
        run: python -c "import pypu; pypu.show_versions()"
      - name: Test
        run: python -m pytest --cov --cov-report=term

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check metadata and README rendering
        run: twine check --strict dist/*
      - name: Install the wheel and import it
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[xgboost]"
          cd /tmp && python -c "import pypu, pypu.models; [getattr(pypu.models, m) for m in pypu.models.__all__]; print(pypu.__version__)"
