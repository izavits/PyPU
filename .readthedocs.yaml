# Read the Docs build of the documentation site (https://pypu.readthedocs.io).
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # hatch-vcs computes the version from git tags, which Read the Docs' shallow clone
      # does not have.
      - git fetch --unshallow || true
      - git fetch --tags || true
    pre_install:
      - python -m pip install --upgrade pip # pip >= 25.1 is needed for --group
      # PyPI's Linux PyTorch wheels pull in CUDA; the CPU build is much smaller.
      - python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
    post_install:
      - python -m pip install --group docs

python:
  install:
    # Every extra, so that the gallery runs every example.
    - method: pip
      path: .
      extra_requirements:
        - xgboost
        - torch
        - cvxopt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
